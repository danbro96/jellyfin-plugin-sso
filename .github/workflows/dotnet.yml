name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Force JS actions onto Node 24 (Node 20 deprecated; forced default mid-June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      # GITHUB_TOKEN authenticates the Jellyfin GitHub Packages source (nuget.config)
      # so the 12.0.0 pre-release packages can be restored.
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --warnaserror
    - name: Test
      run: dotnet test --no-build --verbosity normal
